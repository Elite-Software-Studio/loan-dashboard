# Development docker-compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Stop at build stage for development
    environment:
      NODE_ENV: development
      SEED_DATABASE: true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/build
    command: npm run dev

