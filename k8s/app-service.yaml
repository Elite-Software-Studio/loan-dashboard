apiVersion: v1
kind: Service
metadata:
  name: loan-admin-service
  namespace: loan-admin
  labels:
    app: loan-admin
    component: frontend
spec:
  type: ClusterIP  # Use LoadBalancer for cloud providers, or NodePort for bare metal
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: loan-admin
    component: frontend

