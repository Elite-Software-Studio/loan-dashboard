apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-admin-config
  namespace: loan-admin
data:
  NODE_ENV: "production"
  APP_PORT: "3000"
  POSTGRES_DB: "loan_admin"
  POSTGRES_USER: "postgres"
  POSTGRES_PORT: "5432"
  SEED_DATABASE: "false"
  # Database URL will be constructed from service name
  # Format: postgresql://POSTGRES_USER:POSTGRES_PASSWORD@postgres-service:5432/POSTGRES_DB

