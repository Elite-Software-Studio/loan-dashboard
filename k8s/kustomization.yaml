apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loan-admin

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - app-deployment.yaml
  - app-service.yaml
  - ingress.yaml
  - hpa.yaml

# Common labels applied to all resources
commonLabels:
  app: loan-admin
  managed-by: kustomize

