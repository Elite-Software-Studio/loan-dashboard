apiVersion: v1
kind: Secret
metadata:
  name: loan-admin-secrets
  namespace: loan-admin
type: Opaque
stringData:
  # Base64 encoded values - replace with actual values
  # To create: echo -n 'your-password' | base64
  POSTGRES_PASSWORD: "cG9zdGdyZXM="  # default: postgres (CHANGE IN PRODUCTION!)
  DATABASE_URL_POSTGRESQL: ""  # Will be constructed from other values
---
# Example: How to create secrets manually
# kubectl create secret generic loan-admin-secrets \
#   --from-literal=POSTGRES_PASSWORD=your-secure-password \
#   --namespace=loan-admin

