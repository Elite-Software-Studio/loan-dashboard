apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-admin-ingress
  namespace: loan-admin
  annotations:
    # For NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For SSL/TLS (if you have cert-manager installed)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Change based on your ingress controller
  rules:
  - host: loan-admin.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loan-admin-service
            port:
              number: 80
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - loan-admin.example.com
  #   secretName: loan-admin-tls

